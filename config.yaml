# ClawStrike OS — Configuration
# Switch your entire AI backend by changing `provider` and filling the matching block.

# ── Provider ──────────────────────────────────────────────────────────────────
# Options: anthropic | openai | ollama
provider: anthropic

# ── Anthropic ─────────────────────────────────────────────────────────────────
anthropic:
  api_key: ""          # leave blank to fall back to ANTHROPIC_API_KEY env var
  model: claude-opus-4-6

# ── OpenAI ────────────────────────────────────────────────────────────────────
openai:
  api_key: ""          # leave blank to fall back to OPENAI_API_KEY env var
  model: gpt-4o

# ── Ollama (local) ────────────────────────────────────────────────────────────
ollama:
  base_url: http://localhost:11434/v1
  model: llama3.1
  api_key: ollama      # required by openai SDK but ignored by ollama

# ── Tools ─────────────────────────────────────────────────────────────────────
tools:
  nmap_timeout: 120
  gobuster_timeout: 120
  gobuster_wordlist: /usr/share/wordlists/dirb/common.txt
  zap_path: ""             # override ZAP binary path (leave blank for auto-detect)

# ── Workflow ───────────────────────────────────────────────────────────────────
# single: one model handles everything
# multi:  fast model for recon/scanning, smart model for analysis/reports
workflow: single

# ── Fast Model (recon, parse, enumerate) ──────────────────────────────────────
# Suggested: ollama (free), groq (free tier), deepseek (cheap), mistral free
fast_model:
  provider: ollama
  model: qwen2.5-coder:7b
  api_key: ollama
  base_url: http://localhost:11434/v1

# ── Smart Model (analyze, exploit, report, plan) ──────────────────────────────
# Suggested: Claude Opus/Sonnet, GPT-4o
smart_model:
  provider: anthropic
  model: claude-opus-4-6
  api_key: ""
  base_url: ""
